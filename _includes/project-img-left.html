<div class="columns is-7 is-variable">
  {% if project.image %}
  <div class="column">
    <figure class="image is-3by2">
      <img src="/assets/images/{{ project.image }}">
    </figure>
  </div>
  {% endif %}
  <div class="column is-three-fifths content">
    <div class="content">
      <p>
      <b>{{ project.title }}</b>
      {{ project.excerpt }}
      <a href="{{ project.external_url | default: project.url }}"><em>Read more</em></a>
      </p>
    </div>
  </div>
</div>
