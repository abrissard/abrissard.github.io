<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    {% if site.icon.size <= 4 %}
      <link
        rel="shortcut icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>"
      >
    {% elsif site.icon != blank %}
      <link rel="shortcut icon" href="{{ site.icon | prepend: '/assets/images/' | relative_url }}">
    {% endif %}
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdn.rawgit.com/jpswalsh/academicons/master/css/academicons.min.css"
    >
    <!--{% feed_meta %}-->
    <script defer src="https://use.fontawesome.com/releases/v6.5.2/js/all.js"></script>
    <script src="/assets/js/navbar-burger.js"></script>
    {% seo %}
  </head>
  <body>
    {% include navigation.html icon-size="lg" %}
    <section class="section">
      <div class="container">
        {{ content }}
      </div>
    </section>
    {% include footer.html icon-size="lg" %}
  </body>
</html>
